name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # evals/requirements.txt (PyYAML, for tests/test_golden_run.py) does not
          # exist yet; `|| true` keeps this step green today and picks it up
          # automatically once a later task adds the file.
          pip install -r evals/requirements.txt || true
          pip install pytest
      - name: Run tests
        run: pytest tests/ -q
