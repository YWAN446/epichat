name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyYAML, which tests/test_golden_run.py imports via evals.golden.run.
          # No `|| true`: the file exists, so a failure here is a real failure.
          pip install -r evals/requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest tests/ -q
