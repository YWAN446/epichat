# The agent must reply in the user's language, independent of English tool
# names and disease canonical names. Deterministic checks cover disease and
# country; the judge covers the reply language itself (see evals/README.md
# for why that split is a judge criterion rather than a rule).
- id: lang-es
  category: language
  critical: false
  turns:
    - "Simula un brote de sarampión en México."
  checks:
    config:
      disease: measles
      country: MEX
    judge:
      - "Replies in Spanish"

